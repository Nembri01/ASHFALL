# Build iOS di ASHFALL su runner macOS in cloud.
# Serve perche' l'IPA non si puo' compilare su Windows: Xcode gira solo su macOS.
#
# Prima del primo build, su codemagic.io:
#   1. collega questo repository
#   2. Teams > Integrations > App Store Connect: aggiungi una chiave API
#      (App Store Connect > Users and Access > Integrations > App Store Connect API,
#       ruolo "App Manager") e chiamala esattamente  ashfall_asc_key
#   3. Environment variables, gruppo "appstore":  APP_STORE_APP_ID = <ID numerico
#      dell'app in App Store Connect>
workflows:
  ios-testflight:
    name: ASHFALL iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: ashfall_asc_key

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.ashfall.game"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Dipendenze npm
        script: npm ci || npm install

      - name: Costruisci www/ e sincronizza Capacitor
        # Solo la piattaforma iOS: sul runner macOS non c'e' l'SDK Android e
        # "cap sync" senza argomenti proverebbe a sincronizzare anche quella.
        script: |
          node tools/build_www.mjs
          npx cap sync ios

      - name: pod install
        script: |
          cd ios/App
          pod install

      - name: Numero build progressivo
        # Apple rifiuta due caricamenti con lo stesso build number.
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((LATEST + 1))

      - name: Diagnostica credenziali Apple
        # Apple risponde 401 alle API di firma: le credenziali arrivano ma
        # vengono rifiutate. Stampo QUALI identificatori sta usando il runner
        # (Key ID e Issuer ID sono identificatori pubblici, non segreti; della
        # chiave privata stampo solo se c'e' e quanto e' lunga, mai il contenuto).
        script: |
          echo "Issuer ID : ${APP_STORE_CONNECT_ISSUER_ID:-(NON IMPOSTATO)}"
          echo "Key ID    : ${APP_STORE_CONNECT_KEY_IDENTIFIER:-(NON IMPOSTATO)}"
          if [ -n "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "Chiave    : presente, ${#APP_STORE_CONNECT_PRIVATE_KEY} caratteri"
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | head -1
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | tail -1
          else
            echo "Chiave    : (NON IMPOSTATA)"
          fi

      - name: Firma automatica
        script: |
          keychain initialize
          # Serve una chiave privata RSA: il certificato di distribuzione e' la
          # meta' pubblica di una coppia di chiavi. Senza, fetch-signing-files
          # scarica il certificato ma non puo' salvarlo ("Cannot save Signing
          # Certificates without certificate private key") e l'archive fallisce
          # con "App requires a provisioning profile".
          # NB: una chiave nuova a ogni build = un certificato nuovo su Apple,
          # e il limite e' 3. Dopo la prima build riuscita conviene salvare
          # questa chiave come variabile sicura CERTIFICATE_PRIVATE_KEY e usare
          # --certificate-key=@env:CERTIFICATE_PRIVATE_KEY per riusare sempre
          # lo stesso certificato.
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Compila IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
